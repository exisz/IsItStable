name: Check New Versions
on:
  schedule:
    - cron: '0 */1 * * *'  # every hour
  workflow_dispatch: {}

concurrency:
  group: check-versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check configured npm packages for new versions
        id: check_versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-new-versions.mjs
      - name: Commit version title cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/version-title-cache.json
          git diff --cached --quiet || (git commit -m "data: refresh version title cache" && git pull --rebase --autostash && git push)
      - name: Trigger sync if new versions were created
        if: steps.check_versions.outputs.created != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --repo exisz/IsItStable --ref "${GITHUB_REF_NAME}"
